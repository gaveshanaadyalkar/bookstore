<html>
<head>
<style>
body {
    background-color: #FFF0F5;
    font-family: 'Georgia', serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    box-sizing: border-box;
}

.login-box {
    background-color: white;
    border-radius: 16px;
    box-shadow: 4px 4px 20px rgba(216, 27, 96, 0.2);
    padding: 40px 45px;
    width: 320px;
    text-align: center;
}

.login-icon {
    width: 70px;
    height: 70px;
    background-color: #D81B60;
    border-radius: 50%;
    margin: 0 auto 15px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: white;
}

h1 {
    color: #D81B60;
    font-size: 24px;
    margin: 10px 0 5px 0;
}

.tagline {
    color: #999;
    font-size: 13px;
    margin-bottom: 30px;
    font-style: italic;
}

.input-group {
    text-align: left;
    margin-bottom: 18px;
}

label {
    font-size: 12px;
    color: #D81B60;
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
}

input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #FFD1DC;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
}

input[type="text"]:focus, input[type="password"]:focus {
    border-color: #D81B60;
}

.remember {
    text-align: left;
    font-size: 12px;
    color: #777;
    margin-bottom: 20px;
}

.login-btn {
    width: 100%;
    background-color: #D81B60;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}

.login-btn:hover {
    background-color: #B0184F;
}

.signup-link {
    font-size: 13px;
    color: #777;
}

.signup-link a {
    color: #D81B60;
    font-weight: bold;
    text-decoration: none;
}

.quote {
    margin-top: 25px;
    font-size: 12px;
    color: #B0184F;
    font-style: italic;
    border-top: 1px solid #FFD1DC;
    padding-top: 15px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="login-icon">&#128214;</div>

    <h1>Welcome Back</h1>
    <p class="tagline">Every book is a new adventure waiting for you</p>

    <form name="loginForm" action="">

        <div class="input-group">
            <label>Username / Email</label>
            <input type="text" name="username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password">
        </div>

        <div class="remember">
            <input type="checkbox" name="remember"> Remember me
        </div>

        <input type="submit" class="login-btn" value="Login">

    </form>

    <p class="signup-link">New here? <a href="registration.html" target="mainFrame">Create an account</a></p>

    <p class="quote">"A reader lives a thousand lives before he dies" &mdash; George R.R. Martin</p>

</div>

</body>
</html>
