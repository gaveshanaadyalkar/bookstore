<html>
<head>
<style>
body {
    background-color: #FFF0F5;
    font-family: 'Georgia', serif;
    margin: 0;
    padding: 30px;
}

h1 {
    color: #D81B60;
    text-align: center;
    margin-bottom: 40px;
    font-size: 32px;
    border-bottom: 3px solid #FFD1DC;
    padding-bottom: 15px;
}

.cart-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
}

.book-card {
    background-color: white;
    border: 1px solid #FFD1DC;
    border-radius: 12px;
    width: 220px;
    padding: 20px;
    text-align: center;
    box-shadow: 3px 3px 10px rgba(216, 27, 96, 0.15);
    transition: transform 0.2s;
}

.book-card:hover {
    transform: translateY(-6px);
    box-shadow: 5px 5px 15px rgba(216, 27, 96, 0.3);
}

.cover {
    width: 100px;
    height: 130px;
    background-color: #D81B60;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px auto;
    border-radius: 6px;
    font-weight: bold;
    font-size: 14px;
}

.category-tag {
    display: inline-block;
    background-color: #FFD1DC;
    color: #D81B60;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
}

.book-title {
    font-size: 16px;
    font-weight: bold;
    margin: 5px 0;
    color: #333;
}

.author {
    font-size: 13px;
    color: #777;
    margin-bottom: 8px;
}

.publisher {
    font-size: 12px;
    color: #999;
    margin-bottom: 10px;
}

.price {
    font-size: 18px;
    font-weight: bold;
    color: #D81B60;
}

.total-box {
    max-width: 300px;
    margin: 40px auto 0 auto;
    background-color: #D81B60;
    color: white;
    border-radius: 12px;
    padding: 20px 30px;
    text-align: center;
    box-shadow: 3px 3px 12px rgba(216, 27, 96, 0.3);
}

.total-box p {
    margin: 0;
    font-size: 13px;
    opacity: 0.85;
}

.total-box h2 {
    margin: 5px 0 0 0;
    font-size: 26px;
}
</style>
</head>

<body>

<h1>&#128218; Your Shopping Cart</h1>

<div class="cart-container">

    <div class="book-card">
        <div class="cover">HP1</div>
        <div class="category-tag">Fiction</div>
        <div class="book-title">Harry Potter and the Philosopher's Stone</div>
        <div class="author">J.K. Rowling</div>
        <div class="publisher">Bloomsbury</div>
        <div class="price">Rs. 499</div>
    </div>

    <div class="book-card">
        <div class="cover">Sapiens</div>
        <div class="category-tag">Non-Fiction</div>
        <div class="book-title">Sapiens: A Brief History of Humankind</div>
        <div class="author">Yuval Noah Harari</div>
        <div class="publisher">Harper</div>
        <div class="price">Rs. 450</div>
    </div>

</div>

<div class="total-box">
    <p>Total Amount</p>
    <h2>Rs. 949</h2>
</div>

</body>
</html>
