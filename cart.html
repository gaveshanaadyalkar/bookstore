
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shopping Cart</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background-color: #FFF0F5;
    font-family: Georgia, serif;
    margin: 0;
    padding: 30px;
    color: #333;
}

h1 {
    color: #D81B60;
    text-align: center;
    margin-bottom: 40px;
    font-size: 36px;
    border-bottom: 3px solid #FFD1DC;
    padding-bottom: 18px;
}

.cart-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
}

.book-card {
    background: white;
    border: 1px solid #FFD1DC;
    border-radius: 12px;
    width: 260px;
    padding: 20px;
    text-align: center;
    box-shadow: 3px 3px 10px rgba(216, 27, 96, 0.15);
}

.cover {
    width: 100px;
    height: 130px;
    background: #D81B60;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    border-radius: 6px;
    font-weight: bold;
}

.book-title {
    font-size: 16px;
    font-weight: bold;
    margin: 10px 0;
}

.price {
    font-size: 18px;
    font-weight: bold;
    color: #D81B60;
    margin: 12px 0;
}

button {
    background: #D81B60;
    color: white;
    border: none;
    padding: 9px 13px;
    border-radius: 20px;
    cursor: pointer;
    margin: 5px;
    font-family: Georgia, serif;
}

button:hover {
    background: #A91449;
}

.total-box {
    max-width: 600px;
    margin: 40px auto;
    background: #D81B60;
    color: white;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    box-shadow: 3px 5px 15px rgba(216, 27, 96, 0.25);
}

.total-box p {
    margin: 10px 0;
}

.total-box h2 {
    margin: 10px 0;
    font-size: 32px;
}

.cart-row {
    background: white;
    color: #333;
    border-radius: 7px;
    padding: 12px;
    margin-top: 10px;
    font-size: 14px;
}

.empty-message {
    text-align: center;
    color: white;
}

.back-link {
    display: block;
    text-align: center;
    margin: 20px;
    color: #D81B60;
    font-weight: bold;
    text-decoration: none;
}

.back-link:hover {
    text-decoration: underline;
}

footer {
    text-align: center;
    padding: 18px;
    margin-top: 30px;
    background: #FFD1DC;
    color: #B0184F;
    border-top: 2px solid #D81B60;
    font-size: 12px;
    line-height: 1.8;
}

footer a {
    color: #D81B60;
    font-weight: bold;
    text-decoration: none;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<h1>📚 Your Shopping Cart</h1>

<div class="cart-container" id="cartContainer"></div>

<div class="total-box">
    <p>Items in Cart: <strong id="itemCount">0</strong></p>
    <p>Total Amount</p>
    <h2 id="totalAmount">Rs. 0</h2>
    <div id="cartItems">
        <p class="empty-message">Your cart is empty.</p>
    </div>
    <button id="clearButton" onclick="clearCart()" hidden>
        Clear Cart
    </button>
</div>

<a class="back-link" href="catalogue.html">← Continue Shopping</a>

<footer>
    &copy; 2026 GL Bajaj Institute of Technology and Management |
    Online Bookstore Project<br>
    Roll No: 2505110120079<br>
    <a href="https://github.com/gaveshanaadyalkar/bookstore.git"
       target="_blank" rel="noopener noreferrer">GitHub Repository</a>
    &nbsp;|&nbsp;
    <a href="https://gaveshanaadyalkar.github.io/bookstore/"
       target="_blank" rel="noopener noreferrer">Live Website</a>
</footer>

<script>
function getCart() {
    try {
        return JSON.parse(localStorage.getItem("bookstoreCart")) || {};
    } catch (error) {
        return {};
    }
}

function renderCart() {
    const cart = getCart();
    const container = document.getElementById("cartContainer");
    const cartItems = document.getElementById("cartItems");

    container.innerHTML = "";
    cartItems.innerHTML = "";

    let total = 0;
    let count = 0;

    for (const id in cart) {
        const book = cart[id];
        const quantity = Number(book.quantity) || 0;
        const price = Number(book.price) || 0;

        if (quantity <= 0) continue;

        const subtotal = price * quantity;
        total += subtotal;
        count += quantity;

        const card = document.createElement("div");
        card.className = "book-card";

        const cover = document.createElement("div");
        cover.className = "cover";
        cover.textContent =
            id === "hp" ? "HP1" :
            id === "sapiens" ? "Sapiens" :
            id === "algorithms" ? "Brief" : "Book";

        const title = document.createElement("div");
        title.className = "book-title";
        title.textContent = book.name;

        const priceElement = document.createElement("div");
        priceElement.className = "price";
        priceElement.textContent = "Rs. " + price;

        const quantityElement = document.createElement("p");
        quantityElement.textContent = "Quantity: " + quantity;

        const subtotalElement = document.createElement("p");
        subtotalElement.textContent = "Subtotal: Rs. " + subtotal;

        const removeButton = document.createElement("button");
        removeButton.textContent = "Remove One";
        removeButton.onclick = function() {
            removeOne(id);
        };

        const addButton = document.createElement("button");
        addButton.textContent = "Add One";
        addButton.onclick = function() {
            addOne(id);
        };

        card.append(
            cover, title, priceElement, quantityElement,
            subtotalElement, addButton, removeButton
        );

        container.appendChild(card);

        const row = document.createElement("div");
        row.className = "cart-row";
        row.textContent =
            book.name + " × " + quantity + " = Rs. " + subtotal;

        cartItems.appendChild(row);
    }

    if (count === 0) {
        cartItems.innerHTML =
            '<p class="empty-message">Your cart is empty.</p>';
    }

    document.getElementById("itemCount").textContent = count;
    document.getElementById("totalAmount").textContent = "Rs. " + total;
    document.getElementById("clearButton").hidden = count === 0;
}

function addOne(id) {
    const cart = getCart();

    if (!cart[id]) return;

    cart[id].quantity = (Number(cart[id].quantity) || 0) + 1;
    localStorage.setItem("bookstoreCart", JSON.stringify(cart));
    renderCart();
}

function removeOne(id) {
    const cart = getCart();

    if (!cart[id]) return;

    cart[id].quantity--;

    if (cart[id].quantity <= 0) {
        delete cart[id];
    }

    localStorage.setItem("bookstoreCart", JSON.stringify(cart));
    renderCart();
}

function clearCart() {
    if (!confirm("Do you want to clear your cart?")) return;

    localStorage.setItem("bookstoreCart", "{}");
    renderCart();
}

renderCart();
</script>

</body>
</html>
